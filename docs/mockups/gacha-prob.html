<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>확률 공지 — 목업</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }

    /* ── Theme ── */
    :root {
      --bg-page:      #f8fafc;
      --bg-header:    #ffffff;
      --bg-nav:       #f1f5f9;
      --bg-content:   #ffffff;
      --bg-table-th:  #f1f5f9;
      --bg-notes:     #f1f5f9;
      --border:       #e2e8f0;
      --text-main:    #1e293b;
      --text-sub:     #475569;
      --text-muted:   #94a3b8;
      --text-yellow:  #b45309;
      --nav-selected-bg:    #dbeafe;
      --nav-selected-text:  #1d4ed8;
      --nav-hover-bg:       #d1fae5;
      --row-hover:    #f8fafc;
    }
    [data-theme="dark"] {
      --bg-page:      #030712;
      --bg-header:    #030712;
      --bg-nav:       #1f2937;
      --bg-content:   #030712;
      --bg-table-th:  #1f2937;
      --bg-notes:     #1f2937;
      --border:       #374151;
      --text-main:    #f1f5f9;
      --text-sub:     #cbd5e1;
      --text-muted:   #6b7280;
      --text-yellow:  #fbbf24;
      --nav-selected-bg:    #1e3a5f;
      --nav-selected-text:  #93c5fd;
      --nav-hover-bg:       #064e3b;
      --row-hover:    #111827;
    }

    body { background: var(--bg-page); color: var(--text-main); min-height: 100vh; }

    /* ── Header ── */
    .page-header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
    }
    .page-header-inner { max-width: 860px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .page-header h1 { font-size: 1.125rem; font-weight: 700; }
    .page-header p  { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* ── Dark mode toggle ── */
    .theme-btn {
      padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-nav); color: var(--text-sub); cursor: pointer; font-size: 0.75rem;
      white-space: nowrap;
    }
    .theme-btn:hover { background: var(--nav-hover-bg); }

    /* ── Main layout ── */
    .wrapper { max-width: 860px; margin: 0 auto; padding: 16px; }

    .container {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    /* ── Left nav ── */
    .nav {
      width: 22%;
      min-width: 100px;
      background: var(--bg-nav);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav hr { border: none; border-top: 1px solid var(--border); }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 8px;
      font-size: 0.72rem;
      text-align: left;
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      line-height: 1.3;
      transition: background 0.12s;
    }
    .nav-btn:hover    { background: var(--nav-hover-bg); }
    .nav-btn.selected {
      background: var(--nav-selected-bg);
      color: var(--nav-selected-text);
      font-weight: 600;
    }
    .nav-btn .icon { font-size: 0.95rem; flex-shrink: 0; line-height: 1; }

    /* ── Right content ── */
    .content {
      flex: 1;
      min-width: 0;
      padding: 16px;
      background: var(--bg-content);
    }
    .content-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    /* ── Description ── */
    .desc-text { font-size: 0.8rem; color: var(--text-sub); line-height: 1.7; margin-bottom: 12px; }
    .notes-box {
      background: var(--bg-notes);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .notes-box p { font-size: 0.72rem; color: var(--text-muted); line-height: 1.8; }

    /* ── Table shared ── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
      color: var(--text-main);
    }
    thead th {
      background: var(--bg-table-th);
      color: var(--text-sub);
      font-weight: 600;
    }
    tbody tr:hover td { background: var(--row-hover); }
    .rank-cell { color: var(--text-yellow); font-weight: 600; vertical-align: middle; }
    .prob-cell { text-align: right; vertical-align: middle; white-space: nowrap; }
    .col-rank  { width: 20%; }
    .col-card  { width: 65%; }
    .col-prob  { width: 15%; }
    .col-item  { }
    .col-prob2 { width: 20%; text-align: right; }

    .notes-text { font-size: 0.7rem; color: var(--text-muted); margin-top: 8px; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ── Responsive ── */
    @media (max-width: 450px) {
      html { font-size: 12px; }
      .nav { width: 22%; min-width: 72px; }
      .nav-btn { padding: 6px 5px; font-size: 0.65rem; gap: 3px; }
      .content { padding: 10px 8px; }
    }
  </style>
</head>

<div class="page-header">

    </div>
    <button class="theme-btn" onclick="toggleTheme()">🌙 다크모드 전환</button>
  </div>

    <nav class="nav" id="nav"></nav>

</div>

// ── 상태 ──────────────────────────────────────────────────
let selectedId = 'description'

// ── 그룹 분류 ───────────────────────────────────────────
const descItems    = CONFIGS.filter(c => c.type === 'description')
const cardPacks    = CONFIGS.filter(c => c.type === 'card' && c.id.startsWith('pack-'))
const xlPacks      = CONFIGS.filter(c => c.type === 'card' && c.id.startsWith('xl-'))
const bundleItems  = CONFIGS.filter(c => c.type === 'bundle')

// ── 네비 렌더 ───────────────────────────────────────────
function renderNav() {
  const nav = document.getElementById('nav')
  const groups = [descItems, cardPacks, xlPacks, bundleItems]

  nav.innerHTML = groups.map((group, gi) => {
    const btns = group.map(item => `
      <button class="nav-btn ${item.id === selectedId ? 'selected' : ''}"
              onclick="select('${item.id}')">
        <span class="icon">${item.icon}</span>
        <span>${item.name}</span>
      </button>`).join('')
    return btns + (gi < groups.length - 1 ? '<hr>' : '')
  }).join('')
}

// ── 콘텐츠 렌더 ─────────────────────────────────────────

  const cfg = CONFIGS.find(c => c.id === selectedId)

  let html = `<div class="content-title">${cfg.icon} ${cfg.name}</div>`

  if (cfg.type === 'description') {
    html += `<p class="desc-text">${cfg.description}</p>`
    if (cfg.notes) {
      html += `<div class="notes-box">${cfg.notes.split('\n').map(l => `<p>${l}</p>`).join('')}</div>`
    }

  } else if (cfg.type === 'card') {
    html += `<div class="table-wrap"><table>
      <thead><tr>
        <th class="col-rank">희귀도</th>
        <th class="col-card">카드</th>
        <th class="col-prob">확률</th>
      </tr></thead>
      <tbody>`
    cfg.groups.forEach(g => {
      g.cards.forEach((card, i) => {
        html += `<tr>`
        if (i === 0) html += `<td class="rank-cell" rowspan="${g.cards.length}">${g.rankLabel}</td>`
        html += `<td>${card.name}</td>`
        if (i === 0) html += `<td class="prob-cell" rowspan="${g.cards.length}">${g.rankProb}</td>`
        html += `</tr>`
      })
    })
    html += `</tbody></table></div>`
    if (cfg.notes) html += `<p class="notes-text">${cfg.notes}</p>`

  } else if (cfg.type === 'bundle') {
    html += `<div class="table-wrap"><table>
      <thead><tr>
        <th class="col-item">아이템 명칭</th>
        <th class="col-prob2">확률</th>
      </tr></thead>
      <tbody>`
    cfg.items.forEach(item => {
      html += `<tr><td>${item.name}</td><td style="text-align:right">${item.prob}</td></tr>`
    })
    html += `</tbody></table></div>`
  }

  el.innerHTML = html
}

// ── 선택 핸들러 ─────────────────────────────────────────
function select(id) {
  selectedId = id
  renderNav()
  renderContent()
}

// ── 다크모드 토글 ────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement
  const isDark = html.getAttribute('data-theme') === 'dark'
  html.setAttribute('data-theme', isDark ? 'light' : 'dark')
  document.querySelector('.theme-btn').textContent = isDark ? '🌙 다크모드 전환' : '☀️ 라이트모드 전환'
}

// ── 초기 렌더 ────────────────────────────────────────────
renderNav()
renderContent()
</script>
</body>
</html>
